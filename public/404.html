<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — Miguel García</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; position: relative; overflow: hidden; }
    .nf-code { font-family: var(--font-display); font-size: clamp(5rem, 22vw, 9rem); font-weight: 700; line-height: 1; letter-spacing: -0.05em; }
    .nf p { margin: 16px auto 28px; color: var(--text-muted); max-width: 28em; }
    .nf .terminal-line { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); }
  </style>
</head>
<body>
  <main class="nf">
    <div class="hero-bg" aria-hidden="true"></div>
    <div style="position: relative">
      <p class="terminal-line">$ cd /esta-pagina → No such file or directory</p>
      <h1 class="nf-code"><span class="grad">404</span></h1>
      <p>La página que buscas no existe o fue movida. · The page you're looking for doesn't exist.</p>
      <a class="btn btn-primary" href="/">Volver al inicio · Back home</a>
    </div>
  </main>
</body>
</html>
